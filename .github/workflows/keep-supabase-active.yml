name: Keep Supabase Project Active

on:
  schedule:
    # Runs every 5 days at 09:00 UTC
    - cron: '0 9 */5 * *'
  workflow_dispatch: # allows manual trigger from the Actions tab too

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase project
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "https://arbtwnreezivailjvdrt.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
